[project]
name = "data3800-gruppe-7"
version = "0.1.0"
description = "Predicts whether a police-reported traffic crash in Chicago led to an injury"
readme = "README.md"
authors = [
    { name = "Haakon Meyer Tischbein", email = "haameti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.2.0",
    "google-genai>=3.5.0",
    "httpx2>=2.16.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
